name: Deploy site

# PREVIEW vs LIVE
# Until you add the repository variable USE_CUSTOM_DOMAIN = true (Settings → Secrets and variables →
# Actions → Variables), the site is built for the preview address
#   https://<owner>.github.io/coppens-education/   (hidden from search engines)
# Once DNS points coppens.education at GitHub Pages, add that variable and re-run this workflow.
on:
  push:
    branches: [main, site-v1]
  schedule:
    - cron: '17 9 * * *' # nightly rebuild (about 5am Eastern) so the pre-rendered "today" stays current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.USE_CUSTOM_DOMAIN == 'true' && 'https://coppens.education' || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: ${{ vars.USE_CUSTOM_DOMAIN == 'true' && '/' || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
